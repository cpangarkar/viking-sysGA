const data = raw.trim().split('\n').map(line => {
  const [assay, level, bias, lci, uci, species, unit, nWithin, perWithin, totPoints] = line.split(',');
  return [assay, parseFloat(level), parseFloat(bias), parseFloat(lci), parseFloat(uci), species, unit, parseInt(nWithin), parseFloat(perWithin), parseInt(totPoints)];
});

const tbody = document.getElementById('table-body');

// Group by assay, then by species within assay
const assayGroups = [];
let curAssay = null;
data.forEach(row => {
  if (!curAssay || curAssay.assay !== row[0]) {
    curAssay = { assay: row[0], speciesGroups: [] };
    assayGroups.push(curAssay);
  }
  const species = row[5];
  let curSpecies = curAssay.speciesGroups[curAssay.speciesGroups.length - 1];
  if (!curSpecies || curSpecies.species !== species) {
    curSpecies = { species, rows: [] };
    curAssay.speciesGroups.push(curSpecies);
  }
  curSpecies.rows.push(row);
});

assayGroups.forEach(ag => {
  const totalAssayRows = ag.speciesGroups.reduce((s, sg) => s + sg.rows.length, 0);
  let assayCellEmitted = false;

  ag.speciesGroups.forEach(sg => {
    const count = sg.rows.length;
    sg.rows.forEach((row, i) => {
      const [assay, level, bias, lci, uci, species, unit, nWithin, perWithin, totPoints] = row;
      const tr = document.createElement('tr');
      tr.className = `species-${species}`;
      const biasClass = bias > 0 ? 'bias-pos' : bias < 0 ? 'bias-neg' : 'bias-zero';

      const assayCell = !assayCellEmitted
        ? `<td class="assay-cell merged" rowspan="${totalAssayRows}">${assay}</td>`
        : '';
      if (!assayCellEmitted) assayCellEmitted = true;

      const speciesCell = i === 0
        ? `<td class="species-label ${species} merged" rowspan="${count}">${species}</td>`
        : '';

      const mergedCells = i === 0
        ? `<td class="merged" rowspan="${count}">${nWithin}</td>
           <td class="merged" rowspan="${count}">${perWithin}%</td>
           <td class="merged" rowspan="${count}">${totPoints}</td>`
        : '';

      tr.innerHTML = `
        ${assayCell}
        ${speciesCell}
        <td>${level}</td>
        <td class="unit">${unit}</td>
        <td class="${biasClass}">${bias}</td>
        <td>${lci}</td>
        <td>${uci}</td>
        ${mergedCells}
      `;
      tbody.appendChild(tr);
    });
  });
});
